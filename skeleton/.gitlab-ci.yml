# Pipeline for a uBixCore host project. The pipeline itself is uBixCore's shared template
# (build → test → migrate → deploy → promote → notify, plus approval and maintenance);
# this file holds only what is specific to this project. Jobs, variables and how to
# override them: docs/ci-setup.md.

include:
  - project: ubixsys/ubixcore
    ref: v0.47.0   # ubixcore-ref: pin to a release tag, never main; bump with `composer update ubixsys/ubixcore`
    file: ci/ubixcore-pipeline.yml

variables:
  UBIX_APPROVAL_OWNERS: ""             # REQUIRED: GitLab usernames whose Approve/👍 lets an MR merge
  # UBIX_TIERS: "dev,staging,prod"     # drop a tier to drop its jobs
  # UBIX_MIGRATE_ENABLED: "true"       # "false" if the app has no database
  # UBIX_PROD_DEPLOY_WHEN: manual      # manual | on_success

# Drop a job:
# ai-review-mr:
#   rules: [{ when: never }]

# Add a job from a hidden base:
# extra-static-checks:
#   extends: [.ubix_static_checks, .ubix_on_dev]
#   needs: [build-dev]
