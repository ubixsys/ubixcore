# uBixCore pipeline — a framework, not a service.
#
#   test          build the throwaway test image (Dockerfile_Test, amd64)
#   lint-and-test phpcs · phpstan (level max) · phpunit, inside that image
#   publish       on a v* tag: ubixsys/ubixcore (Composer), ubixsys/ubixcore-skeleton
#                 (Composer, subtree split), @ubixsys/ubixcore (npm)
#   notify        red pipeline → Discord
#
# There is no runtime image, deploy or promote here: uBixCore is installed by
# host projects from the package registries. The root Dockerfile* and
# bin/{deploy,promote}.sh are the templates those hosts inherit through
# skeleton/; ubixcore itself never runs them.
#
# Notifications go to Discord via bin/lib/notify.sh, which reads the webhooks
# from uBixVault with the read-only CI tokens UBIXVAULT_CI_TOKEN_DEV /
# UBIXVAULT_CI_TOKEN_PROD (masked GitLab variables). The phpunit job reads its
# MariaDB credentials from secret/ubixcore/test-db the same way.

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
      - unknown_failure

stages:
  - test
  - lint-and-test
  - publish
  - notify
  - approval

.registry_login:
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

# Every branch and tag gets the gate; the publish jobs run only on tags.
.on_any_ref:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# test image
# ---------------------------------------------------------------------------
build-test-image:
  extends: [.registry_login, .on_any_ref]
  stage: test
  tags: [shell]
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
      - unknown_failure
  script:
    - |
      set -euo pipefail
      docker buildx build --provenance=false --sbom=false --platform linux/amd64 --push \
        -t "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}-test" -f Dockerfile_Test .

# The uBixOps image (Dockerfile_Ops) is published from GitHub on a tag, so this is the
# only place a broken Dockerfile_Ops shows up before the release: build it, push nothing.
# Branches only -- the tag's own build is the GitHub workflow.
build-ops-image:
  stage: test
  tags: [shell]
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - |
      set -euo pipefail
      docker buildx build --provenance=false --sbom=false --platform linux/amd64 -f Dockerfile_Ops .

# ---------------------------------------------------------------------------
# lint-and-test
# ---------------------------------------------------------------------------
static-checks:
  extends: [.registry_login, .on_any_ref]
  stage: lint-and-test
  tags: [shell]
  timeout: 15 minutes
  script:
    - |
      docker run --rm --workdir /web \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-test" \
        sh -c "set -e && vendor/bin/phpcs --no-cache && vendor/bin/phpstan analyse --no-progress --memory-limit=2G bin php public tests"

# The shared CI template and its scripts (ci/): shellcheck, the offline ci/bin tests
# (fake kubectl, no network) and yamllint. Independent of the image, so it starts at
# once. Packages are fetched into a throwaway container.
ci-template:
  extends: .on_any_ref
  stage: lint-and-test
  tags: [shell]
  needs: []
  timeout: 10 minutes
  script:
    - |
      docker run --rm -v "$PWD:/src" --workdir /src alpine:3.22 sh -c \
        "set -e && apk add --no-cache bash git python3 shellcheck yamllint >/dev/null \
         && shellcheck -x ci/bin/*.sh ci/bin/lib/notify.sh ci/tests/*.sh \
         && bash ci/tests/scripts-test.sh \
         && bash ci/tests/lint.sh --offline"

# PHPUnit against the unit-test MariaDB (`ubixcore-test-db` container on the
# runner host). `database:resetSchema test` rebuilds every sql/<name>.sql —
# for the framework that is sql/ubixcore_test.sql, its own fixture schema.
phpunit:
  extends: [.registry_login, .on_any_ref]
  stage: lint-and-test
  tags: [shell]
  timeout: 30 minutes
  script:
    - |
      set -u; SCRIPT_DIR="$CI_PROJECT_DIR"; . bin/lib/notify.sh
      export TEST_MYSQL_WRITE_HOST="$(vault_kv test-db host)" TEST_MYSQL_WRITE_PORT="$(vault_kv test-db port)"
      export TEST_MYSQL_WRITE_USERNAME="$(vault_kv test-db username)" TEST_MYSQL_WRITE_PASSWORD="$(vault_kv test-db password)"
      export TEST_MYSQL_WRITE_DATABASE="$(vault_kv test-db database)"
      [ -n "$TEST_MYSQL_WRITE_HOST" ] || { echo "no test-db credentials from vault (secret/ubixcore/test-db)"; exit 1; }
      docker run --rm --workdir /web \
        -e TEST_MYSQL_WRITE_HOST -e TEST_MYSQL_WRITE_PORT -e TEST_MYSQL_WRITE_DATABASE \
        -e TEST_MYSQL_WRITE_USERNAME -e TEST_MYSQL_WRITE_PASSWORD \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-test" \
        sh -c "set -e && php bin/ubix database:resetSchema test -n \\
          && mysql -h \$TEST_MYSQL_WRITE_HOST -P \$TEST_MYSQL_WRITE_PORT -u \$TEST_MYSQL_WRITE_USERNAME -p\$TEST_MYSQL_WRITE_PASSWORD -e 'CREATE DATABASE IF NOT EXISTS SYSTEMS' \\
          && php bin/ubix migrate:up --target=test --yes -n \\
          && vendor/bin/phpunit"

# ---------------------------------------------------------------------------
# publish — on a v* tag
# ---------------------------------------------------------------------------
# The framework to this project's Composer registry; then skeleton/ split out
# and published as ubixsys/ubixcore-skeleton (bin/publish-skeleton.sh, needs
# GITLAB_SKELETON_TOKEN — fails visibly but allow_failure without it); then
# ts/Ubix to this project's npm registry, version = the tag.
publish-composer:
  stage: publish
  tags: [shell]
  script:
    - '/usr/bin/curl --fail --header "Job-Token: $CI_JOB_TOKEN" --data tag=$CI_COMMIT_TAG "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/composer"'
  only: [tags]

publish-skeleton:
  stage: publish
  tags: [shell]
  needs: [publish-composer]
  variables: { GIT_DEPTH: "0" }
  script: [bash bin/publish-skeleton.sh]
  allow_failure: true
  only: [tags]

# npm: to npmjs.com when uBixVault secret/ubixcore/npmjs holds an automation
# token (key `token`, read with UBIXVAULT_CI_TOKEN_PROD); otherwise to this
# project's GitLab npm registry with the job token. Composer packages reach
# Packagist through its GitHub hook on the public mirror — nothing to do here.
publish-npm:
  stage: publish
  tags: [shell]
  needs: [publish-composer]
  script:
    - |
      set -euo pipefail
      VERSION="${CI_COMMIT_TAG#v}"
      SCRIPT_DIR="$CI_PROJECT_DIR"; . bin/lib/notify.sh
      NPMJS_TOKEN="$(CI_COMMIT_REF_NAME=main vault_kv npmjs token)"
      if [ -n "$NPMJS_TOKEN" ]; then
        REGISTRY="https://registry.npmjs.org/"; NPM_AUTH="$NPMJS_TOKEN"; echo "publishing to npmjs.com"
      else
        REGISTRY="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"; NPM_AUTH="$CI_JOB_TOKEN"; echo "no npmjs token in vault — publishing to the GitLab registry"
      fi
      # Run as the runner's own uid (never root): a root-owned node_modules in
      # the bind-mounted workspace broke every later checkout on this runner.
      docker run --rm -v "$PWD/ts/Ubix:/pkg" -w /pkg --user "$(id -u):$(id -g)" -e HOME=/tmp \
        -e NPM_REGISTRY="$REGISTRY" -e NPM_TOKEN="$NPM_AUTH" -e VERSION="$VERSION" \
        node:22 sh -c '
          set -e
          printf "@ubixsys:registry=%s\n%s:_authToken=%s\n" "$NPM_REGISTRY" "${NPM_REGISTRY#https:}" "$NPM_TOKEN" > .npmrc
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          npm ci --no-audit --no-fund
          npm publish --registry "$NPM_REGISTRY" --access public
          rm -rf .npmrc node_modules dist'
  only: [tags]

# ---------------------------------------------------------------------------
# notify — red pipeline → #ubixcore-alerts
# ---------------------------------------------------------------------------
notify-failure:
  extends: .on_any_ref
  stage: notify
  tags: [shell]
  timeout: 5 minutes
  when: on_failure
  script:
    - |
      set -u
      SCRIPT_DIR="$CI_PROJECT_DIR"; . bin/lib/notify.sh
      WHO="${GITLAB_USER_NAME:-${GITLAB_USER_LOGIN:-unknown}}"
      TEXT="Ref: ${CI_COMMIT_REF_NAME} — pushed by ${WHO}
      Commit: [${CI_COMMIT_TITLE:-$CI_COMMIT_SHORT_SHA}](${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}) (${CI_COMMIT_SHORT_SHA})
      Author: ${CI_COMMIT_AUTHOR:-unknown}
      Pipeline: ${CI_PIPELINE_URL}"
      discord alerts 15158332 "🔴 Pipeline FAILED" "$TEXT"
      exit 0

# ---------------------------------------------------------------------------
# approval — every merge needs a human sign-off
# ---------------------------------------------------------------------------
# Fails until the branch's MR has an Approve or a thumbs-up (bin/ubix
# ci:requireApproval). With "Pipelines must succeed" on, that blocks the merge.
# GitLab does not re-run a pipeline on approval: approve, then retry this job.
# Its own stage AFTER notify, on purpose: notify-failure runs on any red ref and
# would page #ubixcore-alerts for every push that is simply not approved yet.
# MERGE_APPROVAL_OWNERS may sign off on their own MRs (every MR here is opened
# under the owner's account); the job log says so when it happens. Token:
# APPROVAL_GITLAB_TOKEN, or AI_REVIEW_GITLAB_TOKEN (Reporter, api, masked, not
# protected). See docs/standards/branching-and-git-workflow.md § Merge sign-off.
require-approval:
  extends: .registry_login
  stage: approval
  tags: [shell]
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  variables:
    MERGE_APPROVAL_OWNERS: cwolsen
  script:
    - |
      docker run --rm --workdir /web \
        -e APPROVAL_GITLAB_TOKEN -e AI_REVIEW_GITLAB_TOKEN -e MERGE_APPROVAL_OWNERS \
        -e CI_API_V4_URL -e CI_PROJECT_ID -e CI_COMMIT_BRANCH -e CI_MERGE_REQUEST_IID \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-test" \
        php bin/ubix ci:requireApproval
